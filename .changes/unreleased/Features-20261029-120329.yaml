kind: Features
body: Allow descendant_of in where filters on Athena and Trino. The query was run on Trino and on Athena engine version 3. Both unroll the recursion, so a hierarchy deeper than max_recursion_depth (10 by default) or with parents that form a cycle fails with a recursion depth error
